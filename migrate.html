<!DOCTYPE html>
<html>
<head>
    <title>Run Migration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
        .loading { color: blue; }
    </style>
</head>
<body>
    <h2>Run Database Migration</h2>
    <p>Klik tombol di bawah untuk menjalankan migration:</p>
    <button id="migrateBtn" onclick="runMigration()">Run Migration</button>
    <p id="status" class="loading"></p>
    <pre id="result">Menunggu...</pre>

    <script>
    async function runMigration() {
        const btn = document.getElementById('migrateBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');

        btn.disabled = true;
        status.textContent = 'Running migration...';
        result.textContent = 'Loading...';

        try {
            // GANTI URL INI dengan domain backend yang sebenarnya
            const response = await fetch('https://be-surat-tugas.velotek.co.id/api/system/migrate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: 'sipintar_migration_2024' })
            });

            const contentType = response.headers.get('content-type');
            console.log('Response status:', response.status);
            console.log('Content type:', contentType);

            let data;
            if (contentType && contentType.includes('application/json')) {
                data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);

                if (data.success) {
                    status.textContent = '✓ Migration completed successfully!';
                    status.className = 'success';
                } else {
                    status.textContent = '✗ Migration failed: ' + (data.message || 'Unknown error');
                    status.className = 'error';
                }
            } else {
                const text = await response.text();
                result.textContent = 'Non-JSON response:\n\n' + text;
                status.textContent = '✗ Unexpected response format';
                status.className = 'error';
            }
        } catch (error) {
            result.textContent = 'Error: ' + error.message;
            status.textContent = '✗ Request failed: ' + error.message;
            status.className = 'error';
            console.error('Error:', error);
        }

        btn.disabled = false;
    }
    </script>
</body>
</html>
